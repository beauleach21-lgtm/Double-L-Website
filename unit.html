<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double L — machine detail</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<meta name="description" content="Specifications and day rate for a machine in the Double L fleet. Wholesale re-rental for rental yards. Bay City, Texas. (682) 262-1318.">
<script defer src="/_vercel/speed-insights/script.js"></script>

<!--
  ============================================================
  MACHINE DETAIL — one page, all five machines
  ============================================================

  unit.html?u=water-6x6      6×6 Water Truck
  unit.html?u=water-auto     Water Truck — Automatic
  unit.html?u=svl97          Kubota SVL97-3
  unit.html?u=svl75          Kubota SVL75-3
  unit.html?u=lighttower     Light Tower

  One file rather than five, so adding a machine is one entry in the
  FLEET object below and nothing else. No build step, same as index.html.
  A missing or unknown ?u= falls back to a list of all five.

  ------------------------------------------------------------
  WHAT IS ON THESE PAGES IS EVERYTHING THAT IS CONFIRMED — AND
  IT IS THIN. Read this before showing it to Hunter.
  ------------------------------------------------------------
  Every specification here traces to the old site or to PRODUCT.md.
  That is two or three facts per machine. Nothing has been invented:
  no operating weights that weren't published, no engine numbers, no
  dimensions, no tank material, no pump rate, no lift height, no lumen
  output, no run time, no fuel capacity. A rental yard knows this
  equipment and would catch a wrong figure immediately.

  TO MAKE THESE REAL SPEC SHEETS, GET FROM HUNTER:
    water trucks  · pump make and rate, spray heads/cannon, tank
                    material, fill time, empty vs loaded weight,
                    engine, CDL requirement
    skid steers   · engine hp (have it for the 75 only), operating
                    capacity, lift height, aux hydraulic flow,
                    tracks or wheels, which attachments go with it
    light tower   · mast height, lamp count and output, generator
                    kW, run time per tank, tank size, trailer weight
    all           · year/model, hours, whether it goes out on
                    Double L's own trailer

  The layout already has a slot for each of these — fill in the
  `specs` array for a machine and the rows appear. Nothing else
  needs changing.
  ============================================================
-->

<style>
@font-face{font-family:"BarlowCond";src:url("assets/fonts/barlow-condensed-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"BarlowCond";src:url("assets/fonts/barlow-condensed-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"BarlowCond";src:url("assets/fonts/barlow-condensed-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Archivo";src:url("assets/fonts/archivo-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo";src:url("assets/fonts/archivo-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Archivo";src:url("assets/fonts/archivo-700.woff2") format("woff2");font-weight:700;font-display:swap}

/* These tokens are copied from index.html. There is no shared stylesheet —
   the site is deliberately build-step-free — so a palette or line-weight
   change has to be made in BOTH files. Flagged in index.html too. */
:root{
  --cream:#FAF5EC; --sand:#F0E6D6; --card:#FFFCF6;
  --ink:#2B2320; --ink-soft:#6A5B52;
  --brick:#A83B32; --brick-deep:#7C2820; --brick-ink:#FFF8F0; --brick-wash:#F6E7DF;
  --bw:2px; --gut:clamp(20px,5vw,60px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-size:18px;line-height:1.58;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:"BarlowCond",sans-serif;font-weight:600;
  line-height:1.0;letter-spacing:.03em;text-transform:uppercase}
a{color:inherit}
.wrap{width:100%;max-width:1300px;margin:0 auto;padding-inline:var(--gut)}
.num{font-variant-numeric:tabular-nums}

/* ---------- nav, matching index.html ---------- */
.nav{position:sticky;top:0;z-index:60;background:var(--cream);border-bottom:var(--bw) solid var(--ink)}
.nav-in{display:flex;align-items:center;gap:clamp(12px,1.8vw,22px);
  padding:clamp(16px,2vw,22px) var(--gut);max-width:none}
.mark{font-family:"BarlowCond",sans-serif;font-weight:600;
  font-size:clamp(28px,3.4vw,42px);letter-spacing:-.035em;text-transform:uppercase;
  text-decoration:none;display:inline-flex;align-items:center;line-height:1;flex:none}
.mark i{font-style:normal;background:var(--brick);color:var(--brick-ink);
  border:var(--bw) solid var(--ink);padding:2px 13px;margin-left:7px;box-shadow:0 4px 0 var(--ink)}
.mark .rr{margin-left:.24em}
.nav .tel{display:inline-flex;align-items:center;gap:11px;flex:none;margin-left:auto;
  background:var(--ink);color:var(--cream);text-decoration:none;
  font-family:"BarlowCond",sans-serif;font-weight:600;font-size:19px;letter-spacing:.05em;
  padding:12px 18px;border:var(--bw) solid var(--ink);box-shadow:0 4px 0 var(--brick-deep);
  white-space:nowrap}
.nav .tel svg{width:19px;height:19px;fill:currentColor}
@media (max-width:520px){
  .mark{font-size:clamp(19px,5.6vw,26px)}
  .mark i{padding:2px 9px;margin-left:5px;box-shadow:0 3px 0 var(--ink)}
  .nav .tel span{display:none}
}

/* ---------- back ---------- */
.back{padding:22px 0 0}
.back a{display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  font-family:"BarlowCond",sans-serif;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;font-size:15px;color:var(--ink-soft)}
.back a:hover{color:var(--brick)}

/* ---------- the machine ---------- */
.unit{padding:26px 0 clamp(46px,6vw,80px)}
.shot{width:100%;height:clamp(240px,38vw,470px);object-fit:cover;
  border:var(--bw) solid var(--ink);box-shadow:0 6px 0 var(--ink);display:block}
.kind{display:inline-block;font-family:"Archivo",sans-serif;font-weight:600;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.15em;
  background:var(--ink);color:var(--cream);border:2px solid var(--ink);
  padding:5px 10px;margin-bottom:14px}
.unit h1{font-size:clamp(2.2rem,5vw,3.8rem);letter-spacing:.014em;margin-bottom:12px}
.lede{font-size:20px;color:var(--ink-soft);max-width:56ch;margin:0}

.cols{display:grid;grid-template-columns:1fr 380px;gap:clamp(24px,3vw,48px);
  align-items:start;margin-top:clamp(28px,3.4vw,46px)}

.bar{display:inline-block;height:14px;width:96px;margin-bottom:14px;
  border:var(--bw) solid var(--ink);
  background:repeating-linear-gradient(135deg,var(--brick) 0 9px,var(--ink) 9px 18px)}
.block{margin-bottom:clamp(28px,3vw,42px)}
.block h2{font-size:clamp(1.4rem,2.3vw,1.85rem);margin-bottom:14px}
.block p{margin:0;max-width:62ch}

/* spec table */
.specs{border:var(--bw) solid var(--ink);background:var(--card)}
.specs div{display:flex;gap:18px;padding:14px 20px;border-bottom:var(--bw) solid var(--ink)}
.specs div:last-child{border-bottom:0}
.specs dt{flex:0 0 40%;font-family:"BarlowCond",sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--ink-soft);margin:0}
.specs dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

/* the rate card */
.rate{border:var(--bw) solid var(--ink);background:var(--card);
  box-shadow:0 6px 0 var(--ink);position:sticky;top:calc(clamp(16px,2vw,22px)*2 + 46px)}
.rate .in{padding:24px}
.rate .n{font-family:"BarlowCond",sans-serif;font-weight:600;font-size:56px;
  letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.rate .per{font-size:16px;font-weight:600;color:var(--ink-soft);margin-left:8px}
.rate .cap{font-size:14.5px;color:var(--ink-soft);margin:10px 0 0}
.rate .tag{background:var(--brick);color:var(--brick-ink);
  border-top:var(--bw) solid var(--ink);font-family:"BarlowCond",sans-serif;
  font-weight:600;font-size:14.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:11px 22px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
  font-family:"BarlowCond",sans-serif;font-weight:600;font-size:19px;letter-spacing:.05em;
  text-transform:uppercase;padding:15px 24px;border:var(--bw) solid var(--ink);
  background:var(--brick);color:var(--brick-ink);text-decoration:none;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .16s,box-shadow .16s,background .2s;
  margin-top:18px}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);background:var(--brick-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.btn.cream{background:var(--card);color:var(--ink)}
.btn svg{width:18px;height:18px;fill:currentColor}

/* other machines */
.also{border-top:var(--bw) solid var(--ink);background:var(--sand);
  padding-block:clamp(38px,4.6vw,64px)}
.also h2{font-size:clamp(1.5rem,2.6vw,2rem);margin-bottom:20px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mini{background:var(--card);border:var(--bw) solid var(--ink);box-shadow:0 5px 0 var(--ink);
  text-decoration:none;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .18s,box-shadow .18s}
.mini:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.mini img{width:100%;height:120px;object-fit:cover;border-bottom:var(--bw) solid var(--ink)}
.mini .t{padding:14px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.mini h3{font-size:18px}
.mini .r{font-family:"BarlowCond",sans-serif;font-weight:600;font-size:20px;
  margin-top:auto;font-variant-numeric:tabular-nums}

/* footer, matching index.html */
.foot{border-top:var(--bw) solid var(--ink);background:var(--cream);padding:26px 0}
.foot-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--ink-soft)}
.foot .mark{font-size:26px;text-decoration:none}
.foot a{color:inherit}

@media (max-width:980px){
  .cols{grid-template-columns:1fr}
  .rate{position:static}
  .strip{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  .strip{grid-template-columns:1fr}
  .specs div{flex-direction:column;gap:3px}
  .specs dt{flex:none}
}
</style>
</head>
<body>

<header class="nav"><div class="nav-in">
  <a class="mark" href="index.html#top">Double<i>L</i><span class="rr">Re-Rental</span></a>
  <a class="tel" href="tel:+16822621318">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.8 2Z"/></svg>
    <span class="num">(682) 262-1318</span>
  </a>
</div></header>

<main id="main">
  <div class="wrap back"><a href="index.html#fleet">&larr; All equipment</a></div>
  <div class="wrap unit" id="unit"></div>

  <section class="also"><div class="wrap">
    <h2 id="alsoTitle">The rest of the fleet</h2>
    <div class="strip" id="strip"></div>
  </div></section>
</main>

<footer class="foot"><div class="wrap foot-in">
  <a class="mark" href="index.html#top">Double<i>L</i></a>
  <span>Equipment Rental Co &middot; Bay City, TX 77414</span>
  <span style="margin-left:auto"><a href="tel:+16822621318" class="num">(682) 262-1318</a></span>
</div></footer>

<script>
(function(){
  "use strict";

  /* Every figure below is from the old site or PRODUCT.md. Add a row to a
     `specs` array and it appears on the page — see the note at the top of
     this file for what is still needed from Hunter. */
  var FLEET = [
    {
      id:"water-6x6", name:"6×6 Water Truck", kind:"Water truck",
      img:"assets/day/water-6x6.jpg", alt:"6x6 water truck", rate:1600,
      lede:"The one rental yards call us for — dust control on haul roads, pads and lay-downs.",
      specs:[["Capacity","4,000 gallon"],["Drive","Six-wheel drive"],["Transmission","10-speed manual"]],
      about:"A 4,000-gallon truck on six-wheel drive, so it keeps working on a soft or "
           +"broken haul road rather than sitting at the gate. The manual box is the one "
           +"most yards want for water work, where the driver is holding a steady crawl "
           +"while the spray is running."
    },
    {
      id:"water-auto", name:"Water Truck — Automatic", kind:"Water truck",
      img:"assets/day/water-auto.jpg", alt:"Automatic water truck", rate:850,
      lede:"The same 4,000 gallons, with an automatic box.",
      specs:[["Capacity","4,000 gallon"],["Transmission","Automatic"]],
      about:"Same tank as the 6×6, without the manual gearbox. This is the one to send "
           +"when the driver you're putting in it isn't a manual driver — which, on a lot of "
           +"crews now, is most of them. It widens who can take the job."
    },
    {
      id:"svl97", name:"Kubota SVL97-3", kind:"Skid steer",
      img:"assets/day/svl97.jpg", alt:"Kubota SVL97-3 skid steer", rate:613,
      lede:"The larger of the two track loaders.",
      specs:[["Operating weight","11,989 lb"],["Coupler","Hydraulic quick coupler"]],
      about:"A tracked loader for grading, loading, backfilling and moving material around "
           +"a pad or a yard. The hydraulic quick coupler means attachments come on and off "
           +"without anyone getting out to pin them."
    },
    {
      id:"svl75", name:"Kubota SVL75-3", kind:"Skid steer",
      img:"assets/day/svl75.jpg", alt:"Kubota SVL75-3 skid steer", rate:575,
      lede:"The smaller track loader — the one that fits.",
      specs:[["Operating weight","9,315 lb"],["Engine","75 horsepower"]],
      about:"Same jobs as the 97, in a smaller frame. Worth taking when the work is inside "
           +"a tighter footprint, or when what's on site won't carry the bigger machine."
    },
    {
      id:"lighttower", name:"Light Tower", kind:"Lighting", brand:"Generac",
      img:"assets/day/lighttower.jpg", alt:"Towable light tower", rate:152,
      lede:"Night work — a pad, a haul road, or a work area after dark.",
      specs:[["Make","Generac"],["Lamps","Adjustable LED"],["Power","Diesel"],["Transport","Towable"]],
      about:"A towable diesel tower with an adjustable LED head, for lighting a work area "
           +"once the daylight has gone. The one that turns a day job into a two-shift job."
    }
  ];

  var byId = {};
  FLEET.forEach(function(u){ byId[u.id] = u; });

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function money(n){ return "$" + n.toLocaleString("en-US"); }

  function param(){
    var m = /[?&]u=([^&]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : "";
  }

  function renderUnit(u){
    document.title = u.name + " — Double L Re-Rental";
    var rows = u.specs.map(function(s){
      return "<div><dt>" + esc(s[0]) + "</dt><dd>" + esc(s[1]) + "</dd></div>";
    }).join("");

    document.getElementById("unit").innerHTML =
      '<img class="shot" src="' + esc(u.img) + '" alt="' + esc(u.alt) + '">'
    + '<div class="cols">'
    +   '<div>'
    +     '<div class="block" style="margin-top:26px">'
    +       '<span class="kind">' + esc(u.kind) + '</span>'
    +       '<h1>' + esc(u.name) + '</h1>'
    +       '<p class="lede">' + esc(u.lede) + '</p>'
    +     '</div>'
    +     '<div class="block">'
    +       '<span class="bar"></span><h2>Specifications</h2>'
    +       '<dl class="specs">' + rows + '</dl>'
    +     '</div>'
    +     '<div class="block">'
    +       '<span class="bar"></span><h2>What it’s for</h2>'
    +       '<p>' + esc(u.about) + '</p>'
    +     '</div>'
    +   '</div>'
    +   '<aside class="rate">'
    +     '<div class="in">'
    +       '<span class="n num">' + money(u.rate) + '</span><span class="per">per day</span>'
    +       '<p class="cap">That’s the retail day rate — what your customer would pay. '
    +         'Yours is lower. Call and we’ll tell you by how much, and whether it’s free '
    +         'on your dates.</p>'
    +       '<a class="btn" href="tel:+16822621318">'
    +         '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.4 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.8 2Z"/></svg>'
    +         '(682) 262-1318</a>'
    +       '<a class="btn cream" href="index.html#enquire">Ask about this machine</a>'
    +     '</div>'
    +     '<div class="tag">Rental companies pay less</div>'
    +   '</aside>'
    + '</div>';
  }

  function renderList(){
    document.title = "Our equipment — Double L Re-Rental";
    document.getElementById("unit").innerHTML =
      '<div class="block" style="margin-top:26px">'
    + '<span class="bar"></span><h1>Our equipment</h1>'
    + '<p class="lede">Five machines. Pick one for the full detail and the day rate.</p>'
    + '</div>';
    document.getElementById("alsoTitle").textContent = "The fleet";
  }

  function renderStrip(currentId){
    var others = FLEET.filter(function(u){ return u.id !== currentId; });
    document.getElementById("strip").innerHTML = others.map(function(u){
      return '<a class="mini" href="unit.html?u=' + encodeURIComponent(u.id) + '">'
        + '<img src="' + esc(u.img) + '" alt="' + esc(u.alt) + '">'
        + '<div class="t"><h3>' + esc(u.name) + '</h3>'
        + '<span class="r num">' + money(u.rate) + ' <span style="font-size:14px;font-weight:400;color:var(--ink-soft)">per day</span></span>'
        + '</div></a>';
    }).join("");
  }

  var u = byId[param()];
  if (u) { renderUnit(u); renderStrip(u.id); }
  else   { renderList();  renderStrip(null); }
})();
</script>
</body>
</html>
